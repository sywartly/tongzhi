<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地址距离计算器</title>
    <style>
        body, html {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }
        .container {
            background-color: #fff;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1);
            width: 800px;
            text-align: center;
            overflow: hidden;
            position: relative;
            min-height: 500px;
        }
        .title {
            font-size: 32px;
            margin-bottom: 40px;
            color: #343a40;
        }
        .input-group {
            margin-bottom: 40px;
        }
        label {
            font-size: 18px;
            margin-bottom: 10px;
            display: block;
        }
        input[type="file"] {
            display: block;
            margin: 0 auto;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            width: 50%;
            box-sizing: border-box;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        input[type="file"]:hover {
            border-color: #007bff;
        }
        button {
            padding: 20px 40px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 20px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-container {
            margin-top: 30px;
            text-align: left;
            background-color: #f1f3f5;
            padding: 30px;
            border-radius: 15px;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            height: 50%;
            overflow-y: auto;
            font-size: 16px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.5/xlsx.full.min.js"></script>
</head>

<body>
<div class="container">
    <div class="title">地址距离计算器</div>
    <div class="input-group">
        <label for="files">上传Excel文件</label>
        <input type="file" id="files" accept=".xls, .xlsx" multiple>
    </div>
    <button onclick="calculateDistances()">计算距离</button>
    <div class="result-container" id="result"></div>
</div>

<script>
    async function calculateDistances() {
        const files = document.getElementById('files').files;

        if (files.length !== 2) {
            alert('请上传两个Excel文件');
            return;
        }

        const file1 = files[0];
        const file2 = files[1];

        const workbook1 = XLSX.read(await readFile(file1), {type: 'array'});
        const workbook2 = XLSX.read(await readFile(file2), {type: 'array'});

        const sheet1 = workbook1.Sheets[workbook1.SheetNames[0]];
        const sheet2 = workbook2.Sheets[workbook2.SheetNames[0]];

        const addresses1 = [];
        const addresses2 = [];

        const maxRow1 = sheet1['!ref'].split(':')[1].match(/\d+/)[0];
        const maxRow2 = sheet2['!ref'].split(':')[1].match(/\d+/)[0];
        const maxRow = Math.min(maxRow1, maxRow2);
        for (let i = 2; i <= maxRow; i++) { // 修改这里以包含最大行
            const addr1 = sheet1[XLSX.utils.encode_cell({c: 5, r: i})]?.v; // 第六列
            const addr2 = sheet2[XLSX.utils.encode_cell({c: 5, r: i})]?.v; // 第六列
            if (addr1) addresses1.push(addr1);
            if (addr2) addresses2.push(addr2);
        }

        const results = [];
        for (let i = 0; i < addresses1.length && i < addresses2.length; i++) {
            if (addresses1[i] && addresses2[i]) {
                const response = await fetch(`http://192.168.0.100:6583/calculateDistance?address1=${encodeURIComponent(addresses1[i])}&address2=${encodeURIComponent(addresses2[i])}`);
                const data = await response.text();
                results.push(`从 ${addresses1[i]} 到 ${addresses2[i]} 的距离: ${data}`);

                XLSX.utils.sheet_add_aoa(sheet1, [['距离: ' + data]], {origin: XLSX.utils.encode_cell({c: 9, r: i + 2})});
                XLSX.utils.sheet_add_aoa(sheet2, [['距离: ' + data]], {origin: XLSX.utils.encode_cell({c: 9, r: i + 2})});
            } else {
                results.push(`从 ${addresses1[i] || 'undefined'} 到 ${addresses2[i] || 'undefined'} 的距离: undefined`);

                XLSX.utils.sheet_add_aoa(sheet1, [['距离: undefined']], {origin: XLSX.utils.encode_cell({c: 9, r: i + 2})});
                XLSX.utils.sheet_add_aoa(sheet2, [['距离: undefined']], {origin: XLSX.utils.encode_cell({c: 9, r: i + 2})});
            }

            await new Promise(resolve => setTimeout(resolve, 800));
        }

        const wbout1 = XLSX.write(workbook1, {bookType: 'xlsx', type: 'array'});
        const wbout2 = XLSX.write(workbook2, {bookType: 'xlsx', type: 'array'});

        const blob1 = new Blob([wbout1], {type: "application/octet-stream"});
        const blob2 = new Blob([wbout2], {type: "application/octet-stream"});

        const link1 = document.createElement("a");
        const link2 = document.createElement("a");

        const fileName1 = file1.name.split('.').slice(0, -1).join('.') + '_距离.xlsx';
        const fileName2 = file2.name.split('.').slice(0, -1).join('.') + '_距离.xlsx';

        link1.href = URL.createObjectURL(blob1);
        link2.href = URL.createObjectURL(blob2);

        link1.download = fileName1;
        link2.download = fileName2;

        document.body.appendChild(link1);
        document.body.appendChild(link2);
        link1.click();
        link2.click();

        document.body.removeChild(link1);
        document.body.removeChild(link2);

        document.getElementById('result').innerText = results.join('\n');
    }

    function readFile(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(new Uint8Array(e.target.result));
            reader.onerror = reject;
            reader.readAsArrayBuffer(file);
        });
    }
</script>
</body>
</html>
